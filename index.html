<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title></title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div>
        <textarea id="in" rows="2"></textarea>
        <div id="out"></div>
        <button class="button" id="popen">(</button>
        <button class="button" id="pclose">)</button>
        <button class="button" id="exp">^</button>
        <button class="button" id="mod"><span>%</span><span class="small">mod</span></button>
        <button class="button" id="n7">7</button>
        <button class="button" id="n8">8</button>
        <button class="button" id="n9">9</button>
        <button class="button" id="multi">×</button>
        <button class="button" id="n4">4</button>
        <button class="button" id="n5">5</button>
        <button class="button" id="n6">6</button>
        <button class="button" id="div">÷</button>
        <button class="button" id="n1">1</button>
        <button class="button" id="n2">2</button>
        <button class="button" id="n3">3</button>
        <button class="button" id="add">+</button>
        <button class="button" id="dot">.</button>
        <button class="button" id="n0">0</button>
        <button class="button" id="eq">=</button>
        <button class="button" id="min">-</button>
        <button class="button" id="del">DEL</button>
        <button class="button" id="clear">C</button>
    </div>
    <script src="index.js"></script>
</body>
</html>
